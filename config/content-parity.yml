    notes: The source-grounded Theory, Simulated Example, web Summary, 15-group exercise sheet with 150 tasks, and 150 matching step-by-step solutions exist across all three locales. Theory now begins its measurement-level sequence with one shared twelve-learner workshop dataset, a focused table for each scale, guided reading, compatible summaries, and nine early scale-specific graphics. It explains why each measure of centre and variability is useful, includes bimodal and multimodal cases, expands the diagnosis of suggestive graphics, and closes by establishing the value of description before bridging to probability. Practice is ordered as Theory then Calculator Practice. The expanded summary covers the topic's central definitions, formulas, tables, figure guidance, and interpretation checks and ends with three lined note pages. The topic tab exposes every document as localized PDF and editable Word; the Downloads page groups the six files into one topic ZIP and retains individual access in a disclosure. Publication status is In Review. The August 2026 source, correctness, interaction, and responsive visual audit passed for all three locales; it does not constitute final publication review.
