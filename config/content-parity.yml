pages:
  - id: ratiomera-home
    page_type: landing
    branch: ratiomera
    paths:
      en: en/home-ratiomera-en.qmd
      de: de/home-ratiomera-de.qmd
      sq: sq/home-ratiomera-sq.qmd
    content_status: {en: review, de: review, sq: review}
    parity_mode: full
    last_synchronized: 2026-08-20
    notes: The three landing pages share the same wider-access rationale, connect clear explanation with curiosity and intrinsic motivation, and use a two-column Two Branches layout that collapses to one column on phones. Their multilingual philosophy treats language as a route into the same aligned learning path while adapting each version to its linguistic and educational context. Additional languages require volunteers who can translate, review, and maintain them; automated translation alone is not treated as sufficient review.
  - id: ratiomera-about
    page_type: page
    branch: ratiomera
    paths:
      en: en/pages/about-ratiomera-en.qmd
      de: de/pages/about-ratiomera-de.qmd
      sq: sq/pages/about-ratiomera-sq.qmd
    content_status: {en: review, de: review, sq: review}
    parity_mode: full
    last_synchronized: 2026-08-20
    notes: Canonical project-wide About pages explain Ratiomera's purpose, development method, two-branch structure, open-access commitment, multilingual review boundary, community role, and browser-first use. They state that mobile remains supported while larger screens are clearest for wide formulas, tables, and interactive figures. Root and branch compatibility redirects remain uncounted.
  - id: ratiomera-contact
    page_type: page
    branch: ratiomera
    paths:
      en: en/pages/contact-ratiomera-en.qmd
      de: de/pages/contact-ratiomera-de.qmd
      sq: sq/pages/contact-ratiomera-sq.qmd
    content_status: {en: review, de: review, sq: review}
    parity_mode: full
    last_synchronized: 2026-09-01
    notes: The project-wide Contact page distinguishes general, branch-specific, and volunteering inquiries; identifies Krenar Sherifi as a psychologist and Donat Ismaili as a teacher; marks both as current Ratiomera Statistics contributors; publishes the active info, statistics, mathematics, and volunteering role addresses as mail links; and explains response limits, useful message details, and the absence of tutoring or urgent support in every locale.
  - id: ratiomera-support
    page_type: page
    branch: ratiomera
    paths:
      en: en/pages/support-ratiomera-en.qmd
      de: de/pages/support-ratiomera-de.qmd
      sq: sq/pages/support-ratiomera-sq.qmd
    content_status: {en: review, de: review, sq: review}
    parity_mode: full
    last_synchronized: 2026-08-17
    notes: The shared project-wide Support page explains volunteer work, prominently labelled non-financial contribution actions and thank-you addresses, and Ratiomera's broader open-access opposition to subscriptions, paywalls, expiring trials, and required in-app purchases. It states that donations are not currently accepted and presents a possible future Swiss association and donation framework only as a later stewardship step if meaningful use justifies sustained long-term investment. Statistics and Mathematics Support routes remain uncounted compatibility redirects to this canonical page.
  - id: ratiomera-legal
    page_type: page
    branch: ratiomera
    paths:
      en: en/pages/legal-ratiomera-en.qmd
      de: de/pages/legal-ratiomera-de.qmd
      sq: sq/pages/legal-ratiomera-sq.qmd
    content_status: {en: review, de: review, sq: review}
    parity_mode: full
    last_synchronized: 2026-09-01
    notes: The localized Legal Notice identifies Krenar Sherifi as the responsible person, accurately describes Ratiomera as a volunteer-led project without paid offers or online contracting, states that no postal address is currently published, and provides the active informatics address and website. It also documents GitHub Pages hosting and security logging, disabled Ratiomera analytics and counters, Cyon-hosted email processing, retention criteria, data-minimization guidance, and the privacy contact.
