schema_version: 1
canonical_locale: en
locale_order: [en, de, sq]
locale_tags:
  en: en
  de: de-CH
  sq: sq
number_format_policy: >-
  Preserve the English source convention for displayed decimal points and numerical
  precision in all locales. Underlying values, rounding, symbols, and formula notation
  must remain identical. A future locale-format migration must update all three locales,
  downloads, figures, tables, tests, and this policy together.
review_status_values:
  - approved_for_platform
  - needs_expert_review
terms:
  absolute_frequency:
    en: Absolute frequency
    de: Absolute Häufigkeit
    sq: Frekuenca absolute
    abbreviation: null
    domain: descriptive_statistics
    note: The Albanian term requires review by a native-speaking subject expert.
    avoid: []
    review_status: needs_expert_review
  absolute_scale:
    en: Absolute scale
    de: Absolutskala
    sq: Shkalla absolute
    abbreviation: null
    domain: measurement
    note: The course treats this as a stricter subtype of ratio scale for natural counts with a fixed unit. The Albanian term requires expert review.
    avoid: []
    review_status: needs_expert_review
  admissible_transformation:
    en: Admissible transformation
    de: Zulässige Transformation
    sq: Transformimi i lejueshëm
    abbreviation: null
    domain: measurement
    note: Use for a recoding that preserves the defining information of a measurement level. The Albanian term requires expert review.
    avoid: []
    review_status: needs_expert_review
  adjusted_r_squared:
    en: Adjusted R-squared
    de: Korrigiertes R-Quadrat
    sq: R-katrori i përshtatur
    abbreviation: adjusted R²
    domain: modeling
    note: R-squared adjusted for sample size and the number of fitted predictor parameters; unlike ordinary R-squared, it can decrease when a predictor is added. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  responsible_person:
    en: Responsible person
    de: Verantwortliche Person
    sq: Personi përgjegjës
    abbreviation: null
    domain: organization
    note: Legal-notice heading for the named person responsible for Ratiomera. The Albanian term requires expert review.
    avoid: [Invented title or legal entity]
    review_status: needs_expert_review
  swiss_association:
    en: Swiss association
    de: Schweizer Verein
    sq: Shoqatë zvicerane
    abbreviation: null
    domain: organization
    note: A possible future legal form only. Do not imply that Ratiomera is already an association. The Albanian term requires expert review.
    avoid: [Current association status]
    review_status: needs_expert_review
  volunteering_contact:
    en: Volunteering contact
    de: Kontakt für freiwillige Mitarbeit
    sq: Kontakti për punë vullnetare
    abbreviation: null
    domain: organization
    note: The dedicated route for offers of volunteer help. The Albanian term requires expert review.
    avoid: [General inquiries as the only volunteering route]
    review_status: needs_expert_review
  analysis_of_variance:
    en: Analysis of variance
    de: Varianzanalyse
    sq: Analiza e variancës
    abbreviation: ANOVA
    domain: inferential_statistics
    note: Keep the international abbreviation in every locale.
    avoid: []
    review_status: approved_for_platform
  alternative_hypothesis:
    en: Alternative hypothesis
    de: Alternativhypothese
    sq: Hipoteza alternative
    abbreviation: H₁
    domain: hypothesis_testing
    note: Preserve the mathematical subscript.
    avoid: []
    review_status: approved_for_platform
  base_rate:
    en: Base rate
    de: Basisrate
    sq: Norma bazë
    abbreviation: null
    domain: probability
    note: Use for the prior prevalence or frequency relevant to an update. The Albanian term requires review by a native-speaking subject expert.
    avoid: []
    review_status: needs_expert_review
  bayes_theorem:
    en: Bayes' theorem
    de: Satz von Bayes
    sq: Teorema e Bayes-it
    abbreviation: null
    domain: probability
    note: Preserve the direction of conditioning and include the complete evidence denominator.
    avoid: []
    review_status: approved_for_platform
  bonferroni_correction:
    en: Bonferroni correction
    de: Bonferroni-Korrektur
    sq: Korrigjimi Bonferroni
    abbreviation: null
    domain: multiple_comparisons
    note: A multiple-comparison correction that uses a per-test threshold of alpha divided by the number of tests to bound the familywise error rate without requiring independent tests. The Albanian label is provisional and requires expert review.
    avoid: [Sidak correction as a synonym]
    review_status: needs_expert_review
  binomial_distribution:
    en: Binomial distribution
    de: Binomialverteilung
    sq: Shpërndarja binomiale
    abbreviation: null
    domain: probability
    note: Use for the count of successes across a fixed number of Bernoulli trials, not for one binary outcome alone.
    avoid: []
    review_status: approved_for_platform
  box_plot:
    en: Box plot
    de: Boxplot
    sq: Diagrami kuti-me-mustaqe
    abbreviation: null
    domain: descriptive_statistics
    note: Use the two-word English form in prose; Quarto identifiers may use boxplot. The Albanian pedagogical label makes the whiskers explicit.
    avoid: []
    review_status: needs_expert_review
  central_tendency:
    en: Central tendency
    de: Zentrale Tendenz
    sq: Prirja qendrore
    abbreviation: null
    domain: descriptive_statistics
    note: Use Lagemass only when referring specifically to a measure of location.
    avoid: [Zentralmass as a general synonym]
    review_status: approved_for_platform
  central_limit_theorem:
    en: Central limit theorem
    de: Zentraler Grenzwertsatz
    sq: Teorema e kufirit qendror
    abbreviation: CLT
    domain: probability
    note: The theorem concerns the standardized sum or mean under stated conditions; it does not make raw observations normal. The Albanian term requires expert review.
    avoid: [A universal sample-size cutoff]
    review_status: needs_expert_review
  coefficient_of_determination:
    en: Coefficient of determination
    de: Bestimmtheitsmass
    sq: Koeficienti i përcaktimit
    abbreviation: R²
    domain: modeling
    note: The proportion of observed outcome variation represented by a fitted model relative to its intercept-only reference. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  conditional_probability:
    en: Conditional probability
    de: Bedingte Wahrscheinlichkeit
    sq: Probabiliteti i kushtëzuar
    abbreviation: null
    domain: probability
    note: "Preserve the order in P(A | B): A is the event of interest and B is the condition."
    avoid: []
    review_status: approved_for_platform
  categorical_variable:
    en: Categorical variable
    de: Kategoriale Variable
    sq: Ndryshorja kategorike
    abbreviation: null
    domain: measurement
    note: The Albanian term requires review by a native-speaking subject expert.
    avoid: [Ndryshorja kategoriale]
    review_status: needs_expert_review
  confidence_interval:
    en: Confidence interval
    de: Konfidenzintervall
    sq: Intervali i besimit
    abbreviation: CI
    domain: inferential_statistics
    note: German may use KI only when the abbreviation is defined locally.
    avoid: []
    review_status: approved_for_platform
  contrast:
    en: Contrast
    de: Kontrast
    sq: Kontrasti
    abbreviation: null
    domain: analysis_of_variance
    note: A weighted combination of group or cell means, ordinarily with weights summing to zero, that answers a specified comparison question. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  correlation:
    en: Correlation
    de: Korrelation
    sq: Korrelacioni
    abbreviation: null
    domain: association
    note: Do not imply causation.
    avoid: []
    review_status: approved_for_platform
  covariance:
    en: Covariance
    de: Kovarianz
    sq: Kovarianca
    abbreviation: null
    domain: association
    note: null
    avoid: []
    review_status: approved_for_platform
  coverage_error:
    en: Coverage error
    de: Abdeckungsfehler
    sq: Gabimi i mbulimit
    abbreviation: null
    domain: sampling
    note: Use when the operational sampling frame does not fully match the population named in the claim. The Albanian term requires review by a native-speaking subject expert.
    avoid: [Sampling variability]
    review_status: needs_expert_review
  cumulative_distribution_function:
    en: Cumulative distribution function
    de: Verteilungsfunktion
    sq: Funksioni kumulativ i shpërndarjes
    abbreviation: CDF
    domain: probability
    note: "Define it as F(x) = P(X <= x). The Albanian term requires review by a native-speaking subject expert."
    avoid: []
    review_status: needs_expert_review
  cumulative_relative_frequency:
    en: Cumulative relative frequency
    de: Kumulierte relative Häufigkeit
    sq: Frekuenca relative kumulative
    abbreviation: null
    domain: descriptive_statistics
    note: Use only for variables with a meaningful order. The Albanian term requires expert review.
    avoid: []
    review_status: needs_expert_review
  degrees_of_freedom:
    en: Degrees of freedom
    de: Freiheitsgrade
    sq: Shkallët e lirisë
    abbreviation: df
    domain: inferential_statistics
    note: A procedure-specific count of independent information remaining after fitted quantities or constraints are accounted for; it determines the relevant reference distribution. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  density_function:
    en: Density function
    de: Dichtefunktion
    sq: Funksioni i dendësisë
    abbreviation: null
    domain: probability
    note: Density height is not point probability; continuous probabilities are areas over intervals. The Albanian term requires expert review.
    avoid: [Probability function when a continuous density is intended]
    review_status: needs_expert_review
  dependent_variable:
    en: Dependent variable
    de: Abhängige Variable
    sq: Ndryshorja e varur
    abbreviation: null
    domain: research_design
    note: Outcome variable may be preferable in prediction contexts.
    avoid: []
    review_status: approved_for_platform
  descriptive_statistics:
    en: Descriptive statistics
    de: Deskriptive Statistik
    sq: Statistika përshkruese
    abbreviation: null
    domain: descriptive_statistics
    note: Use the plural English form for the field and methods collectively.
    avoid: []
    review_status: approved_for_platform
  distribution:
    en: Distribution
    de: Verteilung
    sq: Shpërndarja
    abbreviation: null
    domain: descriptive_statistics
    note: null
    avoid: []
    review_status: approved_for_platform
  diverse_gender_category:
    en: Diverse
    de: divers
    sq: Divers
    abbreviation: null
    domain: demographic_data
    note: >-
      Category label used in the current simulated dataset. The Albanian label and
      the cross-locale identity terminology require review by a native-speaking
      subject expert before reuse beyond this example.
    avoid: []
    review_status: needs_expert_review
  dummy_coding:
    en: Dummy coding
    de: Dummy-Codierung
    sq: Kodimi me ndryshore treguese
    abbreviation: null
    domain: modeling
    note: >-
      Also called indicator coding. It represents categorical membership with
      binary dummy or indicator variables relative to a stated reference
      category. The Albanian term is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  effect_size:
    en: Effect size
    de: Effektgrösse
    sq: Madhësia e efektit
    abbreviation: null
    domain: inferential_statistics
    note: German follows de-CH spelling with ss.
    avoid: [Effektgröße]
    review_status: approved_for_platform
  estimator:
    en: Estimator
    de: Schätzer
    sq: Vlerësuesi
    abbreviation: null
    domain: inferential_statistics
    note: Use for a rule or statistic intended to estimate a population parameter. The Albanian term requires expert review.
    avoid: [Estimate when the rule rather than its realized value is intended]
    review_status: needs_expert_review
  event:
    en: Event
    de: Ereignis
    sq: Ngjarja
    abbreviation: null
    domain: probability
    note: An event is a subset of the sample space.
    avoid: []
    review_status: approved_for_platform
  event_complement:
    en: Complement
    de: Komplementärereignis
    sq: Ngjarja plotësuese
    abbreviation: null
    domain: probability
    note: Use for all outcomes in the sample space that are not in the stated event. The Albanian term requires expert review.
    avoid: []
    review_status: needs_expert_review
  event_intersection:
    en: Intersection
    de: Schnittmenge
    sq: Prerja e ngjarjeve
    abbreviation: null
    domain: probability
    note: Use for outcomes shared by all stated events. The Albanian term requires expert review.
    avoid: []
    review_status: needs_expert_review
  event_union:
    en: Union
    de: Vereinigung
    sq: Bashkimi i ngjarjeve
    abbreviation: null
    domain: probability
    note: Use the inclusive or meaning unless the context explicitly states otherwise. The Albanian term requires expert review.
    avoid: [Exclusive or as the default interpretation]
    review_status: needs_expert_review
  expected_value:
    en: Expected value
    de: Erwartungswert
    sq: Vlera e pritur
    abbreviation: null
    domain: probability
    note: The expected value is a probability-weighted long-run center and need not be an attainable outcome.
    avoid: [Expected outcome when attainability would be implied]
    review_status: approved_for_platform
  f_statistic:
    en: F statistic
    de: F-Statistik
    sq: Statistika F
    abbreviation: F
    domain: inferential_statistics
    note: A ratio of a model or factor mean square to an error mean square, evaluated against an F distribution under the null hypothesis. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  factor:
    en: Factor
    de: Faktor
    sq: Faktori
    abbreviation: null
    domain: analysis_of_variance
    note: A categorical explanatory variable whose categories are called levels in an analysis of variance design. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  familywise_error_rate:
    en: Familywise error rate
    de: Familienweise Fehlerrate
    sq: Norma e gabimit për familjen e testeve
    abbreviation: FWER
    domain: multiple_comparisons
    note: The probability of making at least one Type I error within a defined family of tests. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  fitted_value:
    en: Fitted value
    de: Angepasster Wert
    sq: Vlera e përshtatur
    abbreviation: null
    domain: modeling
    note: The outcome value estimated by a fitted model for a stated set of predictor values. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  frequency:
    en: Frequency
    de: Häufigkeit
    sq: Frekuenca
    abbreviation: null
    domain: descriptive_statistics
    note: Use consistently in tables and figure labels.
    avoid: []
    review_status: needs_expert_review
  frequency_distribution:
    en: Frequency distribution
    de: Häufigkeitsverteilung
    sq: Shpërndarja e frekuencave
    abbreviation: null
    domain: descriptive_statistics
    note: The Albanian term requires review by a native-speaking subject expert.
    avoid: []
    review_status: needs_expert_review
  histogram:
    en: Histogram
    de: Histogramm
    sq: Histogrami
    abbreviation: null
    domain: descriptive_statistics
    note: null
    avoid: []
    review_status: approved_for_platform
  histogram_bin:
    en: Histogram bin
    de: Histogrammklasse
    sq: Klasa e histogramit
    abbreviation: null
    domain: descriptive_statistics
    note: Use for the class defined by a pair of histogram boundaries. The Albanian term requires review by a native-speaking subject expert.
    avoid: [Interval when the intended concept is a histogram class]
    review_status: needs_expert_review
  hypothesis_test:
    en: Hypothesis test
    de: Hypothesentest
    sq: Testi i hipotezës
    abbreviation: null
    domain: hypothesis_testing
    note: Use Hypothesenprüfung for the broader process only when that distinction is useful.
    avoid: []
    review_status: approved_for_platform
  independent_variable:
    en: Independent variable
    de: Unabhängige Variable
    sq: Ndryshorja e pavarur
    abbreviation: null
    domain: research_design
    note: Predictor may be more accurate outside experimental designs.
    avoid: []
    review_status: approved_for_platform
  statistical_independence:
    en: Statistical independence
    de: Statistische Unabhängigkeit
    sq: Pavarësia statistikore
    abbreviation: null
    domain: probability
    note: Independence means that learning one event does not change the probability of the other; it is not the same as mutual exclusivity.
    avoid: []
    review_status: approved_for_platform
  interaction:
    en: Interaction
    de: Interaktion
    sq: Ndërveprimi
    abbreviation: null
    domain: modeling
    note: A pattern in which the association or effect of one predictor or factor changes across values or levels of another. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  interquartile_range:
    en: Interquartile range
    de: Interquartilsabstand
    sq: Diapazoni ndërkuartilor
    abbreviation: IQR
    domain: descriptive_statistics
    note: Keep IQR in every locale after defining it.
    avoid: []
    review_status: approved_for_platform
  interval_scale:
    en: Interval scale
    de: Intervallskala
    sq: Shkalla intervalore
    abbreviation: null
    domain: measurement
    note: The Albanian term requires review by a native-speaking subject expert.
    avoid: []
    review_status: needs_expert_review
  intraclass_correlation:
    en: Intraclass correlation coefficient
    de: Intraklassenkorrelationskoeffizient
    sq: Koeficienti i korrelacionit brenda klasës
    abbreviation: ICC
    domain: random_effects
    note: A coefficient that quantifies similarity among observations sharing a grouping level relative to total variation in the specified random-factor model. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  kurtosis:
    en: Kurtosis
    de: Kurtosis
    sq: Kurtoza
    abbreviation: null
    domain: descriptive_statistics
    note: Explain the convention used before interpreting values.
    avoid: []
    review_status: needs_expert_review
  linear_transformation:
    en: Linear transformation
    de: Lineare Transformation
    sq: Transformimi linear
    abbreviation: null
    domain: measurement
    note: Use for transformations of the form y = a + bx. The Albanian term requires expert review.
    avoid: []
    review_status: needs_expert_review
  main_effect:
    en: Main effect
    de: Haupteffekt
    sq: Efekti kryesor
    abbreviation: null
    domain: analysis_of_variance
    note: A factor's average pattern across the levels of the other factors in the stated model. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  mixed_design:
    en: Mixed design
    de: Gemischtes Design
    sq: Dizajni i përzier
    abbreviation: null
    domain: research_design
    note: A design combining at least one between-person factor with at least one within-person factor. It describes how observations are collected and must not be used as a synonym for a mixed-effects model. The Albanian label is provisional and requires expert review.
    avoid: [Mixed-effects model as a synonym]
    review_status: needs_expert_review
  mean:
    en: Mean
    de: Mittelwert
    sq: Mesatarja
    abbreviation: null
    domain: descriptive_statistics
    note: Use arithmetic mean when the distinction matters.
    avoid: [Average when the exact measure is ambiguous]
    review_status: approved_for_platform
  measurement_level:
    en: Level of measurement
    de: Messniveau
    sq: Niveli i matjes
    abbreviation: null
    domain: measurement
    note: The course uses a documented five-level refinement.
    avoid: []
    review_status: approved_for_platform
  median:
    en: Median
    de: Median
    sq: Mediana
    abbreviation: null
    domain: descriptive_statistics
    note: null
    avoid: []
    review_status: approved_for_platform
  metric_scale:
    en: Metric scale
    de: Metrische Skala
    sq: Shkalla metrike
    abbreviation: null
    domain: measurement
    note: In this course, the collective label covers interval, ratio, and absolute scales. The Albanian term requires expert review.
    avoid: []
    review_status: needs_expert_review
  missing_data:
    en: Missing data
    de: Fehlende Daten
    sq: Të dhëna që mungojnë
    abbreviation: null
    domain: data_quality
    note: Prefer a plain-language description of the missing values or records when that is more precise. The Albanian term requires review by a native-speaking subject expert.
    avoid: [Missingness in German learner-facing prose]
    review_status: needs_expert_review
  mode:
    en: Mode
    de: Modalwert
    sq: Moda
    abbreviation: null
    domain: descriptive_statistics
    note: Use Modus only when a source or contrast requires it.
    avoid: []
    review_status: needs_expert_review
  modality:
    en: Modality
    de: Modalität
    sq: Modaliteti
    abbreviation: null
    domain: descriptive_statistics
    note: Use for the number or pattern of peaks in a distribution, not as a synonym for the mode. The Albanian term requires expert review.
    avoid: []
    review_status: needs_expert_review
  mutually_exclusive_events:
    en: Mutually exclusive events
    de: Disjunkte Ereignisse
    sq: Ngjarje që përjashtojnë njëra-tjetrën
    abbreviation: null
    domain: probability
    note: Events are mutually exclusive when their intersection is empty. The Albanian term requires expert review.
    avoid: [Independent events as a synonym]
    review_status: needs_expert_review
  nominal_scale:
    en: Nominal scale
    de: Nominalskala
    sq: Shkalla nominale
    abbreviation: null
    domain: measurement
    note: The Albanian term requires review by a native-speaking subject expert.
    avoid: []
    review_status: needs_expert_review
  nonresponse_bias:
    en: Nonresponse bias
    de: Verzerrung durch Nichtantwort
    sq: Anshmëria nga mospërgjigjja
    abbreviation: null
    domain: sampling
    note: Use when response propensity is related to the study variable in a way that distorts the responding sample. The Albanian term requires expert review.
    avoid: [Sampling variability]
    review_status: needs_expert_review
  normal_distribution:
    en: Normal distribution
    de: Normalverteilung
    sq: Shpërndarja normale
    abbreviation: null
    domain: probability
    note: Describe it as a model when applied to real data.
    avoid: []
    review_status: approved_for_platform
  null_hypothesis:
    en: Null hypothesis
    de: Nullhypothese
    sq: Hipoteza zero
    abbreviation: H₀
    domain: hypothesis_testing
    note: Preserve the mathematical subscript.
    avoid: []
    review_status: approved_for_platform
  observation:
    en: Observation
    de: Beobachtung
    sq: Vrojtimi
    abbreviation: null
    domain: data
    note: Use for a recorded case or measurement, according to context.
    avoid: []
    review_status: needs_expert_review
  ordinal_scale:
    en: Ordinal scale
    de: Ordinalskala
    sq: Shkalla rendore
    abbreviation: null
    domain: measurement
    note: The Albanian term requires review by a native-speaking subject expert.
    avoid: []
    review_status: needs_expert_review
  ordinary_least_squares:
    en: Ordinary least squares
    de: Gewöhnliche Methode der kleinsten Quadrate
    sq: Metoda e zakonshme e katrorëve më të vegjël
    abbreviation: OLS
    domain: modeling
    note: A method that selects regression coefficients by minimizing the sum of squared vertical residuals in the outcome direction. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  outcome:
    en: Outcome
    de: Ergebnisvariable
    sq: Ndryshorja e rezultatit
    abbreviation: null
    domain: modeling
    note: The variable whose observed values or conditional mean a model seeks to describe or predict; the label alone does not imply causation. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  outlier:
    en: Outlier
    de: Ausreisser
    sq: Vlerë e veçuar
    abbreviation: null
    domain: descriptive_statistics
    note: German follows de-CH spelling with ss. Do not imply that an outlier is automatically an error.
    avoid: [Ausreißer]
    review_status: needs_expert_review
  parameter:
    en: Parameter
    de: Parameter
    sq: Parametri
    abbreviation: null
    domain: inferential_statistics
    note: Use for a fixed, usually unknown numerical characteristic of a population or probability model.
    avoid: [Statistic when the quantity is computed from a sample]
    review_status: approved_for_platform
  partial_correlation:
    en: Partial correlation
    de: Partielle Korrelation
    sq: Korrelacioni i pjesshëm
    abbreviation: null
    domain: association
    note: The correlation between two residual series after each focal variable has been linearly adjusted for the stated control variable or variables. The Albanian label is provisional and requires expert review.
    avoid: []
    review_status: needs_expert_review
  p_value:
    en: p-value
    de: p-Wert
    sq: Vlera p
    abbreviation: p
    domain: hypothesis_testing
    note: Keep p lowercase and explain its conditioning.
    avoid: []
    review_status: approved_for_platform
  pearson_correlation:
    en: Pearson correlation
    de: Pearson-Korrelation
    sq: Korrelacioni i Pearson-it
    abbreviation: r
    domain: association
    note: Standardized covariance that summarizes the direction and strength of linear association between paired quantitative values. The Albanian label is provisional and requires expert review.
