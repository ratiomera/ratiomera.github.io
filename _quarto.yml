  # ── Footer ─────────────────────────────────────────────────
  # The bar at the bottom of every page.
  # Left side: copyright text. Center: EN | DE | SQ language navigation.
  # Right side: Legal Notice, the official LinkedIn page, and a subtle
  # page-visit counter. The post-render step localizes all three areas, maps
  # each language link to the corresponding current page, adds the external
  # LinkedIn link without a widget or tracker, and adds the counter only on
  # canonical pages.
  # ───────────────────────────────────────────────────────────
  page-footer:
    left: "© 2025–2026 Ratiomera. Free education in mathematics and statistics."
    right:
      - text: "Legal Notice"
        href: en/pages/legal-ratiomera-en.qmd

  search: false  # The streamlined branch headers intentionally omit global search


# ── HTML Output Format ─────────────────────────────────────
# Controls how every HTML page is generated.
# These settings apply globally to all pages unless a specific
# page overrides them in its own frontmatter.
# ───────────────────────────────────────────────────────────
format:
  html:
    # All formula-bearing pages currently live at the same intro-stats depth.
    # The post-render validator also normalizes this path from each rendered
    # page, removes Quarto's obsolete ES6 polyfill, and rejects remote math
    # dependencies before the output can be published.
    html-math-method:
      method: mathjax
      url: ../../../assets/vendor/mathjax-3.2.2/es5/tex-chtml-full.js
    include-after-body:
      - js/sidebar-anchor-close.html  # Collapse the Statistics section drawer after mobile anchor navigation
      - js/topic-tabs.html            # Keep keyboard-selected lesson tabs visible inside the mobile tab strip
      - js/table-scroll.html          # Make wide lesson figures and tables visibly and accessibly scrollable
      - js/plotly-localization.html   # Localize Plotly's built-in boxplot hover statistics
      - js/counters.html              # Upgrade static visit/download placeholders through the configured provider
    theme:
      light: [cosmo, styles/custom.scss]
      # cosmo = Bootstrap 5 Cosmo theme (clean, academic look)
      # styles/custom.scss = our overrides applied on top of cosmo
    toc: true                  # Show table of contents on the right side of each page
    toc-depth: 3               # Include headings up to ### level (h1, h2, h3) in the TOC
    toc-title: "On this page"  # Label above the TOC panel
    number-sections: false     # Do not auto-number headings (1.1, 1.2, etc.)
    smooth-scroll: true        # Clicking a TOC link smoothly scrolls instead of jumping
    css: styles/site.css       # Loads our custom component stylesheet on every page
    link-external-newwindow: true   # External links open in a new browser tab
    link-external-icon: false       # Do not show an arrow icon next to external links
    code-fold: false           # Show R code blocks expanded by default (not collapsible)
    code-tools: false          # Hide the code copy/view tools above code blocks
