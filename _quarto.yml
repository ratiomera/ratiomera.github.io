    # Introduction to Statistics sidebar, shown on all pages inside
    # ratiomera-statistics/en/intro-stats/. Topics are listed flat (no
    # collapsible group) so all are visible and clickable immediately.
    - id: intro-stats-sidebar      # Referenced in ratiomera-statistics/en/intro-stats/_metadata.yml
      title: "Introduction to Statistics"
