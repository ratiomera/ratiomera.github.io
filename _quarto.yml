# ============================================================
# _quarto.yml - Ratiomera Site Configuration
# Version: 2.4.2
#
# What this file does:
#   This is the single master configuration file for the entire
#   website. Quarto reads it during the canonical site build and
#   uses it to build every page, the navigation bar, the sidebars,
#   the footer, and the visual theme.
#
# Site structure (v2.1.0 moved English into its own en/ folder;
# v2.2.0 renamed every file to be self-describing):
#   Root (/)                        -> tiny redirect stub (stays "index.qmd"; see note)
#   en/                             → Ratiomera, the umbrella project (English)
#   de/, sq/                        → complete German / Albanian project sites
#   ratiomera-statistics/              → redirect stub -> ratiomera-statistics/en/
#   ratiomera-statistics/en/           → Ratiomera Statistics, live now (English)
#   ratiomera-statistics/de/, /sq/     → complete localized Statistics routes
#   ratiomera-mathematics/             → redirect stub -> ratiomera-mathematics/en/
#   ratiomera-mathematics/en|de|sq/    → localized planned-state Mathematics pages
#
#   File naming (v2.2.0): canonical home, overview, and page files use
#   {purpose}-{brand}-{lang}.qmd, e.g. home-statistics-en.qmd,
#   about-mathematics-en.qmd, support-ratiomera-de.qmd, so that the
#   filename alone (visible in an editor tab, a flat search result,
#   or a file list with paths truncated) tells you what it is and
#   which language it is, without needing the full path. Topic pages retain
#   their established tNN_slug.qmd names inside locale folders. This is
#   what makes "update Topic 1 in English, then apply the same
#   change to the German and Albanian files" a well-defined request:
#   the EN/DE/SQ counterpart of a canonical page is in the matching sibling
#   en/de/sq folder, with either the language suffix swapped or the same topic
#   filename retained.
#   See the repository map in README.md for the public naming contract.
#
#   COMPATIBILITY STUBS: true directory roots keep index.qmd so a web server
#   can auto-serve index.html. Root-level about.qmd, contact.qmd, legal.qmd,
#   and support.qmd plus locale index.qmd stubs retain their historical names
#   as redirect-only routes. config/content-parity.yml is the authoritative
#   inventory. Never rename or remove a compatibility route without updating
#   that manifest and providing an intentional replacement.
#
# IMPORTANT RULE:
#   Never edit this file without running `scripts/render-site.sh` afterward.
#   Changes here affect every page on the site simultaneously.
#   If the site stops building after a change here, undo your last
#   edit. YAML is whitespace-sensitive and a single wrong indent
#   will break the build.
#
# Deployment:
#   Run `scripts/render-site.sh` locally. Output goes to docs/.
#   Open docs/index.html in a browser to preview the site.
#   GitHub Pages serves docs/ at the canonical origin https://ratiomera.ch.
#   Counter providers remain disabled in config/counters.yml until a provider
#   and its privacy details have been explicitly approved.
# ============================================================

project:
  type: website        # Tells Quarto this is a multi-page website (not a book or presentation)
  output-dir: docs     # All built HTML files go into the /docs folder. DO NOT edit /docs directly.
  resources:
    - CNAME
    - .nojekyll
    - assets/brand/ratiomera-mark.svg
    - assets/brand/ratiomera-statistics-mark.svg
    - assets/brand/ratiomera-mathematics-mark.svg
    - assets/brand/favicon.svg
    - assets/vendor/mathjax-3.2.2/**
    - assets/vendor/r-widgets/**
    - ratiomera-statistics/en/downloads/files/**
    - ratiomera-statistics/de/downloads/files/**
    - ratiomera-statistics/sq/downloads/files/**
  post-render:
    - scripts/localize-mathjax.R  # Keep formula rendering offline with the pinned local MathJax distribution
    - scripts/rewrite-navbar.R  # Make each section's final HTML navbar correct without runtime JavaScript
    - scripts/validate-counters.R  # Verify canonical counter coverage and exclude redirect outputs
    - scripts/ensure-site-libs.R  # Restore and verify every shared dependency referenced by rendered HTML
  render:
    - "*.qmd"          # Render root-level .qmd compatibility stubs
    - "**/*.qmd"       # Render all .qmd files in subdirectories (en/, de/, sq/, ratiomera-statistics/, ratiomera-mathematics/, etc.)

website:
  title: "Ratiomera"
  site-url: "https://ratiomera.ch"
  description: "Ratiomera is a multilingual educational project developing analytical thinking through mathematics, statistics, and evidence-based reasoning."
  favicon: assets/brand/favicon.svg


  # ── Navigation Bar ─────────────────────────────────────────
  # The horizontal bar at the top of every page starts from one shared
  # Quarto definition (Quarto does not support a different navbar per
  # section or language). This definition is the complete build-time
  # seed: global Ratiomera links plus the Statistics course link. After
  # Quarto renders, scripts/rewrite-navbar.R turns that seed into the
  # exact umbrella, Statistics, or Mathematics header for each output
  # page. Branch headers retain a same-locale link to the other branch, so a
  # reader can move directly between Statistics and Mathematics. The generated
  # HTML is therefore correct before JavaScript runs.
  #
  # The post-render step identifies items from their configured hrefs
  # before it translates or repoints them. Contact and Support always
  # retain their root, project-wide destinations. The left-side
  # course item remains a native Quarto navigation item, so it inherits
  # Quarto's desktop, collapsed-mobile, keyboard, and focus behaviour.
  #
  # href values are paths to .qmd source files (not .html output files),
  # always resolved relative to the project root regardless of which
  # page they appear on. Quarto converts them to the correct .html
  # paths in the built site.
  # ───────────────────────────────────────────────────────────
  navbar:
    background: light  # White background (Bootstrap colour name)
    foreground: dark   # Dark text ensures readable contrast on white
    collapse-below: xl # Keep the longest localized/branch header clear at 1024px
    logo: assets/brand/ratiomera-mark.svg
    logo-alt: ""  # The adjacent visible brand text names the linked identity
    left:
      - text: Introduction to Statistics
        href: ratiomera-statistics/en/intro-stats/overview-intro-stats-en.qmd
      - text: Downloads
        href: ratiomera-statistics/en/downloads/overview-downloads-en.qmd
    right:
      - text: About
        href: en/pages/about-ratiomera-en.qmd
      - text: Statistics
        href: ratiomera-statistics/en/home-statistics-en.qmd
      - text: Mathematics
        href: ratiomera-mathematics/en/home-mathematics-en.qmd
      - text: Contact
        href: en/pages/contact-ratiomera-en.qmd
      - text: Support
        href: en/pages/support-ratiomera-en.qmd


  # ── Sidebars ───────────────────────────────────────────────
  # Sidebars appear on the LEFT of configured pages. A sidebar can
  # provide in-page section links (Statistics home) or a page list
  # (Introduction to Statistics and Downloads). It is activated by
  # setting sidebar: <sidebar-id> in page or directory metadata.
  #
  # Configured sidebars:
  #   statistics-home-sidebar → activated in the Statistics home frontmatter
  #   intro-stats-sidebar → activated via each locale's intro-stats metadata
  #   downloads-sidebar → activated via each locale's Downloads metadata
  # The Downloads sidebar lists learning collections, while the responsive
  # material grid stays inside the standard Statistics page width.
  # ───────────────────────────────────────────────────────────
  sidebar:
