          text: "Overview"
        - href: ratiomera-statistics/en/home-statistics-en.qmd#where-to-begin
          text: "Where to Begin"
        - href: ratiomera-statistics/en/home-statistics-en.qmd#platform-status
          text: "Platform Status"

    - id: statistics-home-de-sidebar
      title: "Auf dieser Seite"
      style: docked
      contents:
