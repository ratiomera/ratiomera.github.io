          text: "Einstieg"
        - href: ratiomera-statistics/de/home-statistics-de.qmd#platform-status
          text: "Plattformstatus"

    - id: statistics-home-sq-sidebar
      title: "Në këtë faqe"
      style: docked
      contents:
